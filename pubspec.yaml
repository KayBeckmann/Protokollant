name: protokollant
description: "Digitale Schaltschrank-Abnahme mit PDF-Export"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  pdf: ^3.10.8
  printing: ^5.13.1
  signature: ^5.5.0
  path_provider: ^2.1.4
  share_plus: ^10.1.3
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
