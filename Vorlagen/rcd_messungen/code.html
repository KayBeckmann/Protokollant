<!DOCTYPE html>

<html class="light" lang="de"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RCD Measurement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#4e6874",
                        "on-tertiary": "#ffffff",
                        "background": "#f4faff",
                        "on-tertiary-fixed-variant": "#753400",
                        "primary": "#003461",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb68b",
                        "outline-variant": "#c2c6d1",
                        "surface-container-low": "#e9f6fd",
                        "surface": "#f4faff",
                        "tertiary-fixed": "#ffdbc8",
                        "on-secondary-fixed": "#021f29",
                        "on-tertiary-container": "#ffa46a",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-surface-variant": "#424750",
                        "inverse-primary": "#a3c9ff",
                        "surface-container-high": "#ddeaf2",
                        "tertiary-container": "#793701",
                        "primary-fixed-dim": "#a3c9ff",
                        "primary-container": "#004b87",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#004882",
                        "on-primary-fixed": "#001c38",
                        "on-primary": "#ffffff",
                        "surface-tint": "#27609d",
                        "secondary-container": "#cbe7f5",
                        "surface-variant": "#d7e4ec",
                        "outline": "#727781",
                        "secondary-fixed-dim": "#afcbd8",
                        "on-primary-container": "#8abcff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#304a55",
                        "surface-dim": "#cfdce4",
                        "on-secondary": "#ffffff",
                        "secondary-fixed": "#cbe7f5",
                        "tertiary": "#572500",
                        "on-background": "#111d23",
                        "surface-container-highest": "#d7e4ec",
                        "surface-container": "#e3f0f8",
                        "on-tertiary-fixed": "#321300",
                        "surface-bright": "#f4faff",
                        "inverse-on-surface": "#e6f3fb",
                        "inverse-surface": "#263238",
                        "primary-fixed": "#d3e4ff",
                        "secondary": "#48626e",
                        "on-surface": "#111d23"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack_gap": "12px",
                        "xl": "32px",
                        "lg": "24px",
                        "xs": "8px",
                        "base": "4px",
                        "md": "16px",
                        "sm": "12px",
                        "edge_margin": "16px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["IBM Plex Sans"],
                        "body-lg": ["IBM Plex Sans"],
                        "headline-md": ["IBM Plex Sans"],
                        "headline-lg": ["IBM Plex Sans"],
                        "label-caps": ["IBM Plex Sans"],
                        "status-label": ["IBM Plex Sans"],
                        "body-md": ["IBM Plex Sans"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "status-label": ["13px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen pb-24 pt-16">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-edge_margin h-12 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="electric_bolt">electric_bolt</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Electrical Cabinet Inspection</h1>
</div>
<button class="active:scale-95 duration-100 text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="px-edge_margin max-w-3xl mx-auto space-y-lg mt-8">
<div class="mb-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-base">RCD Measurements</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Record trip times and currents for Residual Current Devices.</p>
</div>
<!-- RCD List/Grid -->
<div class="space-y-stack_gap" id="rcd-container">
<!-- Entry 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md relative group">
<div class="flex justify-between items-start mb-sm">
<div class="w-full">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">RCD Name / ID</label>
<input class="w-full bg-surface border border-outline-variant rounded p-2 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="e.g. F1" type="text" value="F1 (Main)"/>
</div>
<button class="ml-4 text-outline hover:text-error transition-colors mt-6" title="Remove Entry">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">Auslösezeit (ms)</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded p-2 pl-3 pr-10 font-body-lg text-body-lg text-on-surface font-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="0.0" type="number" value="24.5"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant pointer-events-none">ms</span>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">Auslösestrom (mA)</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded p-2 pl-3 pr-10 font-body-lg text-body-lg text-on-surface font-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="0" type="number" value="30"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant pointer-events-none">mA</span>
</div>
</div>
</div>
<!-- Status Toggle -->
<div class="mt-md pt-sm border-t border-outline-variant flex items-center justify-between">
<span class="font-status-label text-status-label text-on-surface-variant">Test Status</span>
<div class="flex gap-2">
<button class="px-4 py-2 rounded-full border border-secondary text-secondary font-status-label text-status-label hover:bg-secondary-container transition-colors">N/A</button>
<button class="px-4 py-2 rounded-full border border-error text-error font-status-label text-status-label hover:bg-error-container transition-colors">Fail</button>
<button class="px-4 py-2 rounded-full bg-primary text-on-primary font-status-label text-status-label border border-primary">Pass</button>
</div>
</div>
</div>
<!-- Entry 2 (Empty) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-md relative">
<div class="flex justify-between items-start mb-sm">
<div class="w-full">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">RCD Name / ID</label>
<input class="w-full bg-surface border border-outline-variant rounded p-2 font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="e.g. F2 (Lighting)" type="text"/>
</div>
<button class="ml-4 text-outline hover:text-error transition-colors mt-6" title="Remove Entry">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">Auslösezeit (ms)</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded p-2 pl-3 pr-10 font-body-lg text-body-lg text-on-surface font-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="0.0" type="number"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant pointer-events-none">ms</span>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-base uppercase">Auslösestrom (mA)</label>
<div class="relative">
<input class="w-full bg-surface border border-outline-variant rounded p-2 pl-3 pr-10 font-body-lg text-body-lg text-on-surface font-mono focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="0" type="number"/>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant pointer-events-none">mA</span>
</div>
</div>
</div>
<div class="mt-md pt-sm border-t border-outline-variant flex items-center justify-between">
<span class="font-status-label text-status-label text-on-surface-variant">Test Status</span>
<div class="flex gap-2">
<button class="px-4 py-2 rounded-full border border-secondary text-secondary font-status-label text-status-label hover:bg-secondary-container transition-colors">N/A</button>
<button class="px-4 py-2 rounded-full border border-secondary text-secondary font-status-label text-status-label hover:bg-error-container hover:text-error hover:border-error transition-colors">Fail</button>
<button class="px-4 py-2 rounded-full border border-secondary text-secondary font-status-label text-status-label hover:bg-primary hover:text-on-primary hover:border-primary transition-colors">Pass</button>
</div>
</div>
</div>
</div>
<!-- Add Button -->
<button class="w-full mt-lg py-3 rounded-lg border-2 border-dashed border-outline text-secondary font-status-label text-status-label flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors active:scale-[0.99]">
<span class="material-symbols-outlined">add</span>
            Add RCD Entry
        </button>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-edge_margin pb-safe h-16 bg-surface border-t border-outline-variant md:hidden">
<button class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-surface-container-low transition-colors w-16 h-full active:opacity-80">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-status-label text-status-label text-[10px]">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 hover:bg-surface-container-low transition-colors w-20 h-12 active:opacity-80 mt-1">
<span class="material-symbols-outlined filled-icon" data-icon="fact_check">fact_check</span>
<span class="font-status-label text-status-label text-[10px] font-bold">Checks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-secondary-container hover:bg-surface-container-low transition-colors w-16 h-full active:opacity-80">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-status-label text-status-label text-[10px]">Settings</span>
</button>
</nav>
</body></html>
